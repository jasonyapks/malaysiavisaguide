<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MVG Showreel</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--navy:#071D3A;--royal:#124E9E;--royal2:#2e6dc2;--gold:#D4A017;--gold7:#8A6508;--mist:#E6E8EB;--off:#F7F7F9;--ink:#0f1823;--muted:#55606e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:Inter,'WenQuanYi Zen Hei',sans-serif;color:var(--off);background:#020812}
#world{position:absolute;inset:0}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;overflow:hidden}
.P{font-family:Poppins,'WenQuanYi Zen Hei',sans-serif}
.DS{font-family:'DM Serif Display',serif}
.ch{display:inline-block;will-change:transform}
.mask{overflow:hidden}
.center{left:0;width:1920px;text-align:center}
canvas{position:absolute;left:0;top:0}
.kick{font:600 22px/1 Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase}
/* cards */
.card{position:absolute;width:440px;height:580px;border-radius:26px;overflow:hidden;background:#0b2650;box-shadow:0 40px 80px rgba(0,0,0,.45);border:1.5px solid rgba(212,160,23,.25);transform-style:preserve-3d}
.card .img{position:absolute;left:0;top:0;width:100%;height:330px;background-size:cover;background-position:center}
.card .shade{position:absolute;left:0;top:0;width:100%;height:330px;background:linear-gradient(180deg,rgba(7,29,58,0) 40%,rgba(11,38,80,1) 100%)}
.card .num{position:absolute;left:34px;top:300px;font:800 64px/1 Poppins;color:var(--gold);letter-spacing:-.02em}
.card .name{position:absolute;left:34px;top:382px;width:380px;font:600 33px/1.1 Poppins;color:#fff}
.card .line{position:absolute;left:34px;top:430px;width:370px;font:400 19px/1.45 Inter;color:rgba(230,232,235,.78)}
.card .chip{position:absolute;left:34px;bottom:30px;padding:9px 16px;border:1.5px solid var(--gold);border-radius:99px;font:600 16px/1 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
/* tools */
.win{position:absolute;width:1000px;height:580px;border-radius:22px;background:#fff;box-shadow:0 60px 120px rgba(7,29,58,.28),0 10px 30px rgba(7,29,58,.12);overflow:hidden}
.bar{height:56px;background:var(--mist);display:flex;align-items:center;padding:0 22px;gap:10px}
.dot{width:14px;height:14px;border-radius:50%}
.url{margin-left:24px;height:34px;flex:1;border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 16px;font:500 17px Inter;color:var(--muted)}
.opt{position:relative;width:880px;height:74px;border:2px solid #d3d8df;border-radius:16px;margin-top:16px;display:flex;align-items:center;padding:0 26px;font:500 25px Inter;color:var(--ink);overflow:hidden;background:#fff}
.opt .rad{width:26px;height:26px;border-radius:50%;border:2px solid #9aa4b1;margin-right:20px;flex:none;position:relative}
.opt .fill{position:absolute;inset:0;background:var(--royal);transform-origin:left center}
.opt span{position:relative}
.chipL{display:inline-block;padding:14px 26px;border-radius:99px;background:var(--navy);color:#fff;font:600 24px Poppins;margin-right:14px}
.calc{position:absolute;width:600px;height:330px;border-radius:22px;background:var(--navy);box-shadow:0 50px 100px rgba(7,29,58,.4);overflow:hidden;color:#fff}
#hud{position:absolute;inset:0;pointer-events:none;font:500 15px/1 Inter;letter-spacing:.24em;text-transform:uppercase}
.crop{position:absolute;width:34px;height:34px;border-color:currentColor;border-style:solid;border-width:0}
</style>
</head>
<body>
<div id="stage"><div id="world"></div><canvas id="fx" width="1920" height="1080"></canvas><div id="hud"></div><canvas id="grain" width="1920" height="1080"></canvas><div id="flash" class="abs" style="inset:0;background:#fff;opacity:0"></div><div id="fade" class="abs" style="inset:0;background:#000;opacity:0"></div></div>
<script>
'use strict';
const DUR = 25, W = 1920, H = 1080;
const IMG = '../../public/images/';
// ───────────────────────── maths ─────────────────────────
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuart: x => 1 - Math.pow(1 - x, 4),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
};
const spring = (dt, damp = 7, freq = 14) => dt <= 0 ? 0 : 1 - Math.exp(-damp * dt) * Math.cos(freq * dt);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => n.toLocaleString('en-US');
// ───────────────────────── dom ─────────────────────────
const stage = document.getElementById('stage'), world = document.getElementById('world');
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || world).appendChild(e); return e; }
function S(e, o) { for (const k in o) e.style[k] = o[k]; return e; }
function T(e, { x = 0, y = 0, z = 0, s = 1, sx, sy, r = 0, rx = 0, ry = 0, o, b } = {}) {
  e.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${sx ?? s},${sy ?? s})`;
  if (o !== undefined) e.style.opacity = o;
  if (b !== undefined) e.style.filter = b > 0.05 ? `blur(${b}px)` : 'none';
}
const vis = (e, v) => { e.style.display = v ? 'block' : 'none'; return v; };
function letters(parent, text) { parent.innerHTML = ''; return [...text].map(c => { const s = el('span', 'ch', parent); s.textContent = c === ' ' ? ' ' : c; return s; }); }
const svgNS = 'http://www.w3.org/2000/svg';
const tf = (cx, cy, { x = 0, y = 0, s = 1, r = 0 } = {}) => `translate(${x + cx} ${y + cy}) rotate(${r}) scale(${s}) translate(${-cx} ${-cy})`;

// ───────────────────────── the logo, rebuilt in vector ─────────────────────────
function star14(cx, cy, R, r) { let d = ''; for (let i = 0; i < 28; i++) { const a = -Math.PI / 2 + i * Math.PI / 14, rr = i % 2 ? r : R; d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(2) + ' ' + (cy + rr * Math.sin(a)).toFixed(2); } return d + 'Z'; }
function facet(cx, cy, deg, L, w) {
  const a = deg * Math.PI / 180, tx = cx + L * Math.cos(a), ty = cy + L * Math.sin(a);
  const lx = cx + w * Math.cos(a - Math.PI / 2), ly = cy + w * Math.sin(a - Math.PI / 2);
  const rx = cx + w * Math.cos(a + Math.PI / 2), ry = cy + w * Math.sin(a + Math.PI / 2);
  return `<path d="M${cx} ${cy}L${tx} ${ty}L${lx} ${ly}Z" fill="#F6D366"/><path d="M${cx} ${cy}L${tx} ${ty}L${rx} ${ry}Z" fill="#B9850C"/>`;
}
function logoSVG(id) {
  const C = { x: 60, y: 110, w: 380, h: 540, r: 34 };
  const page = k => `<rect x="${C.x + 17 * k}" y="${C.y - 15 * k}" width="${C.w}" height="${C.h}" rx="${C.r}" fill="#fff" stroke="#0a2a57" stroke-width="7"/>`;
  const cx = 440, cy = 440;

  <defs>
    <linearGradient id="${id}-cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123a78"/><stop offset=".55" stop-color="#0a2753"/><stop offset="1" stop-color="#071D3A"/></linearGradient>
    <linearGradient id="${id}-gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8D978"/><stop offset=".5" stop-color="#D4A017"/><stop offset="1" stop-color="#A97C0A"/></linearGradient>
    <clipPath id="${id}-cc"><rect x="${C.x}" y="${C.y}" width="${C.w}" height="${C.h}" rx="${C.r}"/></clipPath>
    <mask id="${id}-cm"><rect x="0" y="0" width="700" height="700" fill="#fff"/><circle cx="212" cy="336" r="79" fill="#000"/></mask>
  </defs>
  <g id="${id}-pages">${page(3)}${page(2)}${page(1)}</g>
  <g id="${id}-cover"><rect x="${C.x}" y="${C.y}" width="${C.w}" height="${C.h}" rx="${C.r}" fill="url(#${id}-cg)"/>
    <rect x="${C.x + 14}" y="${C.y + 14}" width="10" height="${C.h - 28}" rx="5" fill="#fff" opacity=".07"/></g>
  <g clip-path="url(#${id}-cc)"><g id="${id}-wedge"><path d="M226 650L440 222L440 650Z" fill="#fff"/><path d="M226 650L440 222" stroke="#071D3A" stroke-width="6" fill="none"/><path d="M262 650L440 296L440 650Z" fill="#E6E8EB" opacity=".55"/></g></g>
  <g id="${id}-cres"><circle cx="176" cy="350" r="93" fill="url(#${id}-gg)" mask="url(#${id}-cm)"/></g>
  <g id="${id}-star"><path d="${star14(287, 346, 60, 27)}" fill="url(#${id}-gg)"/></g>
  <g id="${id}-comp"><g id="${id}-needle">${facet(cx, cy, -45, 300, 25)}${facet(cx, cy, 135, 290, 22)}</g>${comp}
    <circle cx="${cx}" cy="${cy}" r="25" fill="#fff" stroke="url(#${id}-gg)" stroke-width="10"/></g>
  </svg>`;
}
function logoParts(id) { const q = s => document.getElementById(`${id}-${s}`); return { root: document.getElementById(id), pages: q('pages'), cover: q('cover'), wedge: q('wedge'), cres: q('cres'), star: q('star'), comp: q('comp'), needle: q('needle') }; }
function setLogo(L, u) { // u = local time since build start; full build ~1.6s
  const pg = [...L.pages.children];
  pg.forEach((p, i) => { const k = P(u, .18 + (2 - i) * .07, .62 + (2 - i) * .07), e = E.outBack(k, 2.2); p.setAttribute('transform', `translate(${(1 - e) * -40} ${(1 - e) * 40})`); p.style.opacity = k > 0 ? 1 : 0; });
  const c = P(u, 0, .45); L.cover.setAttribute('transform', tf(250, 650, { sx: 1, s: 1 }) + ` translate(250 650) scale(${lerp(.82, 1, E.outBack(c))} ${E.outExpo(c)}) translate(-250 -650)`); L.cover.style.opacity = c > 0 ? 1 : 0;
  const w = E.outExpo(P(u, .3, .75)); L.wedge.setAttribute('transform', `translate(${(1 - w) * 220} ${(1 - w) * 440})`);
  const cr = P(u, .45, 1.0); L.cres.setAttribute('transform', tf(176, 350, { s: E.outBack(cr, 2.4), r: (1 - E.outCubic(cr)) * -160 })); L.cres.style.opacity = cr > 0 ? 1 : 0;
  const st = P(u, .62, 1.12); L.star.setAttribute('transform', tf(287, 346, { s: E.outBack(st, 3), r: (1 - E.outCubic(st)) * 200 })); L.star.style.opacity = st > 0 ? 1 : 0;
  const cp = P(u, .8, 1.45), ce = E.outQuart(cp), land = u - 1.45;
  const wob = land > 0 ? Math.exp(-6 * land) * Math.sin(land * 22) * 9 : 0;
  L.comp.setAttribute('transform', tf(440, 440, { x: (1 - ce) * 760, y: (1 - ce) * -560, s: lerp(2.6, 1, ce), r: (1 - ce) * 600 + wob }));
  L.comp.style.opacity = cp > 0 ? 1 : 0;
}

// ───────────────────────── scenes ─────────────────────────
const scenes = [];
function scene(a, b, bg) { const e = el('div', 'scene'); if (bg) e.style.background = bg; scenes.push({ e, a, b }); return e; }

// S1 — cold open
const s1 = scene(0, 2.0, 'radial-gradient(ellipse 70% 60% at 50% 50%, #0b2650 0%, #04112a 55%, #020812 100%)');
const s1dot = S(el('div', 'abs', s1), { left: '950px', top: '530px', width: '20px', height: '20px', borderRadius: '50%', background: '#D4A017', boxShadow: '0 0 30px 6px rgba(212,160,23,.8)' });
const s1line = S(el('div', 'abs', s1), { left: '210px', top: '538px', width: '1500px', height: '4px', background: 'linear-gradient(90deg,rgba(212,160,23,0),#D4A017 14%,#FBE29A 50%,#D4A017 86%,rgba(212,160,23,0))', boxShadow: '0 0 26px rgba(212,160,23,.85)' });
const s1flare = S(el('div', 'abs', s1), { left: '0', top: '440px', width: '1920px', height: '200px', background: 'radial-gradient(ellipse 50% 50% at 50% 50%, rgba(251,226,154,.35), rgba(212,160,23,0) 70%)', mixBlendMode: 'screen' });
const s1tm = S(el('div', 'abs mask center', s1), { top: '318px', height: '214px' });
const s1t = S(el('div', 'P', s1tm), { font: '800 196px/214px Poppins', letterSpacing: '.07em', color: '#F7F7F9', paddingLeft: '.07em' });
const s1L = letters(s1t, 'SHOWREEL');
const s1bm = S(el('div', 'abs mask center', s1), { top: '566px', height: '50px' });
const s1b = S(el('div', '', s1bm), { font: '500 28px/50px Inter', letterSpacing: '.55em', color: '#D4A017', paddingLeft: '.55em' });
s1b.textContent = 'FEATURING  MALAYSIAVISAGUIDE.COM';
function R1(t) {
  const d = E.outBack(P(t, 0, .18), 3) * (1 - P(t, .25, .5));
  T(s1dot, { s: d, o: d > 0 ? 1 : 0 });
  const ln = E.outExpo(P(t, .15, 1.0)) * (1 - E.inExpo(P(t, 1.55, 1.95)));
  T(s1line, { sx: ln, sy: 1 });
  s1flare.style.opacity = (Math.sin(P(t, .15, 1.2) * Math.PI) * .9 + ln * .3).toFixed(3);
  s1L.forEach((c, i) => {
    const inn = E.outExpo(P(t, .45 + i * .045, 1.25 + i * .045)), out = E.inCubic(P(t, 1.45 + i * .03, 1.8 + i * .03));
    T(c, { y: 214 * (1 - inn) - 240 * out, r: (1 - inn) * 8 });
  });
  const bi = E.outExpo(P(t, .75, 1.4)), bo = E.inCubic(P(t, 1.5, 1.8));
  T(s1b, { y: -50 * (1 - bi) + 50 * bo }); s1b.style.letterSpacing = lerp(.9, .55, bi) + 'em';
}

// S2 — kinetic brand promise: "Clarity for your journey to Malaysia."
const s2 = scene(2.0, 4.06, '#020812');
const s2ghost = S(el('div', 'abs P', s2), { left: '0', top: '200px', font: '800 640px/1 Poppins', whiteSpace: 'nowrap', color: 'transparent', WebkitTextStroke: '2px rgba(46,109,194,.22)' });
const s2bars = [0, 1].map(i => S(el('div', 'abs', s2), { left: '0', top: (i ? 812 : 262) + 'px', width: '1920px', height: '3px', background: '#D4A017', transformOrigin: i ? 'right center' : 'left center' }));
const s2star = el('div', 'abs', s2); S(s2star, { left: '660px', top: '240px', width: '600px', height: '600px' });
s2star.innerHTML = `<svg viewBox="0 0 600 600" width="600" height="600"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE29A"/><stop offset=".5" stop-color="#D4A017"/><stop offset="1" stop-color="#A97C0A"/></linearGradient></defs><path d="${star14(300, 300, 290, 135)}" fill="url(#sg)"/></svg>`;
const WORDS = [
  { t: 2.0, txt: 'CLARITY', bg: '#020812', size: 300 },
  { t: 2.5, txt: 'FOR YOUR', bg: '#071D3A', size: 250 },
  { t: 3.0, txt: 'JOURNEY', bg: '#D4A017', size: 300 },
  { t: 3.25, txt: 'TO', bg: '#F7F7F9', size: 460 },
  { t: 3.5, txt: 'MALAYSIA', bg: '#071D3A', size: 236 },
];
WORDS.forEach((w, i) => {
  w.e = S(el('div', 'abs P center', s2), { top: (540 - w.size * .56) + 'px', font: `800 ${w.size}px/${w.size * 1.12}px Poppins`, whiteSpace: 'nowrap' });
  if (i === 2) w.L = letters(w.e, w.txt); else w.e.textContent = w.txt;
  w.end = i < WORDS.length - 1 ? WORDS[i + 1].t : 4.06;
});
S(WORDS[0].e, { color: '#F7F7F9' });
S(WORDS[1].e, { color: 'transparent', WebkitTextStroke: '4px #D4A017' });
S(WORDS[2].e, { color: '#071D3A' });
S(WORDS[3].e, { color: '#124E9E' });
S(WORDS[4].e, { color: '#F7F7F9', letterSpacing: '.08em' });
function R2(t) {
  const cur = WORDS.findLast(w => t >= w.t) || WORDS[0];
  s2.style.background = cur.bg;
  const dark = cur.bg !== '#D4A017' && cur.bg !== '#F7F7F9';
  s2ghost.textContent = cur.txt; s2ghost.style.WebkitTextStroke = dark ? '2px rgba(46,109,194,.25)' : '2px rgba(7,29,58,.12)';
  T(s2ghost, { x: 300 - (t - 2) * 420 });
  s2bars.forEach((b, i) => { const k = (t - cur.t) / (cur.end - cur.t); T(b, { sx: E.outExpo(clamp(k * 1.6)) * (1 - E.inExpo(clamp(k * 1.2 - .2))), sy: 1 }); b.style.background = cur.bg === '#D4A017' ? '#071D3A' : '#D4A017'; });
  WORDS.forEach((w, i) => {
    const on = t >= w.t && t < w.end; vis(w.e, on); if (!on) return;
    const dt = t - w.t;
    if (i === 0) { const k = E.outExpo(P(dt, 0, .2)); T(w.e, { s: lerp(1.7, 1, k) - dt * .12 }); const ca = 22 * (1 - E.outCubic(P(dt, 0, .4))); w.e.style.textShadow = `${-ca}px 0 rgba(255,40,90,.7), ${ca}px 0 rgba(40,200,255,.7)`; }
    if (i === 1) { const k = E.outExpo(P(dt, 0, .25)); T(w.e, { x: lerp(520, 0, k) - dt * 90, s: 1 }); }
    if (i === 2) w.L.forEach((c, j) => { const k = E.outExpo(P(dt, j * .018, .2 + j * .018)); T(c, { y: (1 - k) * 260, r: (1 - k) * -12 }); });
    if (i === 3) { const k = E.outBack(P(dt, 0, .16), 2); T(w.e, { rx: (1 - k) * 90, s: 1 + dt * .5 }); }
    if (i === 4) { const k = E.outExpo(P(dt, 0, .35)), z = E.inExpo(P(t, 3.72, 3.9)); w.e.style.letterSpacing = lerp(.55, .08, k) + 'em'; T(w.e, { s: 1 + z * 1.5, o: 1 - z }); }
  });
  const sIn = E.outBack(P(t, 3.5, 3.72), 1.6), zoom = E.inExpo(P(t, 3.7, 4.0));
  vis(s2star, t >= 3.5);
  T(s2star, { s: sIn * .82 + zoom * 34, r: (t - 3.5) * 220 + zoom * 120, o: 1 });
  s2star.style.zIndex = 0; WORDS[4].e.style.zIndex = 2;
}

// S3 — identity: the logo assembles
const s3 = scene(3.98, 6.9, 'radial-gradient(ellipse 60% 70% at 40% 50%, #ffffff 0%, #F7F7F9 50%, #E6E8EB 100%)');
const s3grid = S(el('div', 'abs', s3), { inset: '0', backgroundImage: 'radial-gradient(rgba(18,78,158,.16) 1.6px, transparent 1.8px)', backgroundSize: '36px 36px' });
const s3bez = el('div', 'abs', s3); S(s3bez, { left: '0', top: '0', width: '1920px', height: '1080px' });
function bezelSVG(id, cx, cy, col, col2) {
  let ticks = ''; for (let i = 0; i < 120; i++) { const a = i * 3 * Math.PI / 180, l = i % 10 === 0 ? 34 : i % 5 === 0 ? 20 : 10, r = 470; ticks += `<line x1="${cx + r * Math.cos(a)}" y1="${cy + r * Math.sin(a)}" x2="${cx + (r - l) * Math.cos(a)}" y2="${cy + (r - l) * Math.sin(a)}"/>`; }
  return `<svg width="1920" height="1080"><g id="${id}-t" stroke="${col}" stroke-width="2">${ticks}</g>
  <circle id="${id}-c1" cx="${cx}" cy="${cy}" r="500" fill="none" stroke="${col}" stroke-width="2" pathLength="1" stroke-dasharray="1 1"/>
  <circle id="${id}-c2" cx="${cx}" cy="${cy}" r="410" fill="none" stroke="${col2}" stroke-width="3" stroke-dasharray="4 14"/>
  <circle id="${id}-c3" cx="${cx}" cy="${cy}" r="560" fill="none" stroke="${col2}" stroke-width="1.5" pathLength="1" stroke-dasharray=".18 .07"/></svg>`;
}
s3bez.innerHTML = bezelSVG('bz3', 960, 540, 'rgba(18,78,158,.28)', 'rgba(212,160,23,.55)');
const s3logoBox = S(el('div', 'abs', s3), { left: '610px', top: '190px', width: '700px', height: '700px' });
s3logoBox.innerHTML = logoSVG('lg3'); const L3 = logoParts('lg3');
const s3shock = S(el('div', 'abs', s3), { left: '1050px', top: '280px', width: '20px', height: '20px', borderRadius: '50%', border: '6px solid #D4A017', opacity: 0 });

const shutters = [0, 1, 2, 3, 4, 5].map(i => S(el('div', 'abs', world), { left: '0', top: i * 180 + 'px', width: '1920px', height: '182px', background: i % 2 ? '#0d3b78' : '#071D3A', zIndex: 53 }));

}
// HUD
const hud = document.getElementById('hud');
const crops = [[60, 60, 'Top', 'Left'], [60, 60, 'Top', 'Right'], [60, 60, 'Bottom', 'Left'], [60, 60, 'Bottom', 'Right']].map(([x, y, v, h]) => { const c = el('div', 'crop', hud); c.style[v.toLowerCase()] = y + 'px'; c.style[h.toLowerCase()] = x + 'px'; c.style[`border${v}Width`] = '2px'; c.style[`border${h}Width`] = '2px'; return c; });
const hTL = S(el('div', 'abs', hud), { left: '110px', top: '66px' });
const hTR = S(el('div', 'abs', hud), { right: '110px', top: '66px', textAlign: 'right', fontVariantNumeric: 'tabular-nums' });
const hBL = S(el('div', 'abs', hud), { left: '110px', bottom: '66px' }); hBL.textContent = 'malaysiavisaguide.com';
const hBR = S(el('div', 'abs', hud), { right: '110px', bottom: '66px', textAlign: 'right' });
const hProg = S(el('div', 'abs', hud), { left: '0', bottom: '0', height: '4px', width: '1920px', background: '#D4A017', transformOrigin: 'left center' });
const hRec = S(el('span', '', null), { display: 'inline-block', width: '10px', height: '10px', borderRadius: '50%', background: '#e5484d', marginRight: '12px', verticalAlign: '1px' });
const CHAPTERS = [[0, '01 — Open'], [2, '02 — Promise'], [4, '03 — Identity'], [6.875, '04 — Programmes'], [10.3, '05 — Data'], [13.92, '06 — Tools'], [17.44, '07 — Reach'], [21, '08 — Resolve']];

// FX canvas: particle bursts + streaks
const fx = document.getElementById('fx').getContext('2d');
const BURSTS = [{ t: 5.45, x: 1050, y: 630, n: 90, seed: 3, col: '212,160,23' }, { t: 4.0, x: 960, y: 540, n: 70, seed: 9, col: '251,226,154' }, { t: 21.62, x: 603, y: 413, n: 110, seed: 5, col: '212,160,23' }, { t: 13.12, x: 1560, y: 650, n: 40, seed: 12, col: '212,160,23' }];
function FX(t) {
  fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, W, H);
  for (const b of BURSTS) {
    const dt = t - b.t; if (dt < 0 || dt > 1.6) continue;
    const r = rng(b.seed);
    for (let i = 0; i < b.n; i++) {
      const a = r() * Math.PI * 2, sp = 300 + r() * 1300, k = 3 + r() * 2, life = .7 + r() * .9, sz = 1.5 + r() * 4;
      if (dt > life) continue;

}
// film grain + vignette
const grain = document.getElementById('grain'), gx = grain.getContext('2d');
const GRAINS = []; { const r = rng(42); for (let k = 0; k < 8; k++) { const c = document.createElement('canvas'); c.width = 480; c.height = 270; const cx = c.getContext('2d'), id = cx.createImageData(480, 270); for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } cx.putImageData(id, 0, 0); GRAINS.push(c); } }

const vig = S(el('div', 'abs', stage), { inset: '0', background: 'radial-gradient(ellipse 75% 75% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.38) 100%)', pointerEvents: 'none' });

// camera shake on impacts
const IMPACTS = [[2.0, 10], [3.0, 7], [3.5, 8], [4.0, 16], [5.45, 12], [7.0, 6], [10.35, 6], [13.12, 14], [21.0, 18], [21.62, 10]];

  const w = Math.max(fl(4.0, 1, .35), fl(2.0, .35, .18), fl(21.0, 1, .45), fl(13.12, .12, .2));
  flash.style.opacity = w; flash.style.background = t > 20.9 && t < 21.6 ? '#FBE29A' : '#fff';

// ───────────────────────── render ─────────────────────────
window.__render = function (t) {
  for (const sc of scenes) vis(sc.e, t >= sc.a && t < sc.b);
  scenes.forEach((sc, i) => { if (t >= sc.a && t < sc.b) RENDER[i](t); });
  transitions(t); HUD(t); FX(t); GRAIN(t); FLASH(t);

window.__ready = Promise.all([document.fonts.ready, ...PROGS.map(p => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = IMG + p.img; }))]).then(() => document.fonts.load('800 100px Poppins')).then(() => true);
