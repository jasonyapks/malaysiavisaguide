<!doctype html>
<!--
  Source for public/og.png — the sitewide social card.

  Not part of the build. To regenerate: open this file in Chrome at exactly
  1200×630, screenshot to public/og.png, then `sips -z 630 1200 public/og.png`.
  Reword here whenever the site's positioning line changes (last: 10 Nov 2026,
  audit task B3-1 — "independent" replaced by the licensed-agent wording).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&family=Inter:wght@400&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #071d3a;
    background-image: repeating-linear-gradient(135deg, transparent 0 22px, rgb(255 255 255 / 0.025) 22px 23px);
    color: #f7f7f9; font-family: Inter, sans-serif; padding: 72px 80px;
  }
  .arc { position: absolute; right: -330px; bottom: -420px; width: 620px; height: 620px; border: 2px solid rgb(212 160 23 / 0.55); border-radius: 50%; }
  .arc.two { right: -150px; bottom: -520px; width: 560px; height: 560px; border-color: rgb(212 160 23 / 0.8); }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mark { width: 96px; height: 96px; border-radius: 18px; background: #f7f7f9; display: grid; place-items: center; }
  .mark img { height: 70px; }
  .name { font: 700 28px Poppins, sans-serif; }
  .strap { margin-top: 4px; font: 600 15px Poppins, sans-serif; letter-spacing: 0.14em; color: #d4a017; text-transform: uppercase; }
  h1 { margin-top: 44px; font: 700 84px/1.05 Poppins, sans-serif; letter-spacing: -0.01em; }
  .gold { font: italic 400 84px/1.1 "DM Serif Display", serif; color: #d4a017; }
  .lead { margin-top: 26px; max-width: 800px; font-size: 26px; line-height: 1.45; color: #d9dee8; }
  .pills { margin-top: 34px; display: flex; gap: 14px; }
  .pills span { border: 1px solid rgb(212 160 23 / 0.45); border-radius: 999px; padding: 9px 18px; font: 600 14px Poppins, sans-serif; letter-spacing: 0.1em; color: #d4a017; }
</style>
</head>
<body>
  <div class="arc"></div><div class="arc two"></div>
  <div class="brand">
    <div class="mark"><img src="../../public/logo-mark.png" alt=""></div>
    <div>
      <div class="name">Malaysia Visa Guide</div>
      <div class="strap">By a licensed agent · not a government body</div>
    </div>
  </div>
  <h1>Your Guide. Your Future.</h1>
  <div class="gold">Malaysia.</div>
  <p class="lead">Clear, practical guidance on Malaysian visas, residency and long-term living, from a licensed PVIP and MM2H agent.</p>
  <div class="pills"><span>PVIP</span><span>MM2H</span><span>S-MM2H</span><span>DE RANTAU</span><span>WORK &amp; STUDY</span></div>
</body>
</html>
